<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<title>LINNmusic</title>
<style>
:root{--bg:#0d0b1a;--panel:#17142b;--panel2:#201c3a;--line:#2e2950;--text:#f3f0ff;--mute:#9a93c2;--acc:#9b8cff;--acc2:#ffb38a;--nav:62px;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 500px at 15% -10%,#2a1f5c 0,transparent 60%),radial-gradient(700px 400px at 100% 0,#3a1f3d 0,transparent 55%),var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);height:100dvh;overscroll-behavior-y:contain}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{opacity:.75}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.i{width:22px;height:22px;display:block;flex:none;pointer-events:none}

/* ---- шапка ---- */
header{max-width:1100px;width:100%;margin:auto;padding:22px 20px 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-size:2rem;letter-spacing:-.03em;font-weight:900;color:#f4f0ff;line-height:1}
.logo .mark{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px #6a4cff99)}
.logo i{font-style:normal;font-weight:300;color:#7d6af0;letter-spacing:-.01em}
.search{flex:1;min-width:240px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 18px}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;outline:0}
.search button{background:linear-gradient(135deg,var(--acc),#c48cff);color:#150f33;font-weight:700;border-radius:999px;padding:10px 22px}
.gear{width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#me{font-weight:700;color:var(--acc2)}

/* ---- навигация ---- */
nav{max-width:1100px;width:100%;margin:auto;padding:6px 20px;display:flex;gap:22px}
nav button{color:var(--mute);padding:8px 0;border-bottom:2px solid transparent;font-weight:600;display:flex;align-items:center;gap:8px}
nav button .i{display:none}
nav .mob{display:none}
nav button.on{color:var(--text);border-color:var(--acc2)}
.chips{max-width:1100px;width:100%;margin:auto;padding:6px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:.88rem}

/* ---- список ---- */
main{flex:1;overflow:auto;min-height:0}
.wrap{max-width:1100px;margin:auto;padding:10px 20px 140px}
h2{font-size:1.1rem;margin:8px 0 14px;font-weight:700}
.msg{color:var(--mute);padding:34px 0;text-align:center;line-height:1.6}
.msg b{color:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gmin,165px),1fr));gap:18px}
.card{text-align:left;display:block;width:100%;border-radius:14px;padding:10px;transition:background .15s;cursor:pointer;-webkit-user-select:none;user-select:none}
.card:active{background:var(--panel)}
.card.cur{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--acc)}
.art{position:relative;aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,#3a2c7a,#7a3a6a);overflow:hidden;margin-bottom:10px}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .rb{position:absolute;top:6px;width:38px;height:38px;border-radius:50%;background:#0d0b1acc;display:grid;place-items:center}
.art .rb .i{width:19px;height:19px}
.art .lk{right:6px}.art .ed{left:6px}
.art .rb.on{color:var(--acc2)}
.badge{position:absolute;left:6px;bottom:6px;background:var(--acc2);color:#2a1408;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px}
.card .n{font-weight:600;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.card .u{color:var(--mute);font-size:.8rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(hover:hover){.card:hover{background:var(--panel)}.chips button:hover{border-color:var(--acc);color:var(--text)}}

/* ---- ползунки ---- */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;flex:1;min-width:0;height:28px;margin:0;touch-action:pan-y;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,var(--acc) var(--p,0%),#3a3560 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7.5px;box-shadow:0 1px 5px #0009;border:0}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:#3a3560}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.seek{display:flex;align-items:center;gap:8px;width:100%;color:var(--mute);font-size:.75rem;font-variant-numeric:tabular-nums}

/* ---- нижний плеер ---- */
footer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#120f26ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.mprog{display:none}
.bar{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center}
.now{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;text-align:left}
.now img,.now .ph{width:48px;height:48px;border-radius:8px;background:var(--panel2);object-fit:cover;flex:none}
.now div{min-width:0}
.now b,.now span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{color:var(--mute);font-size:.8rem}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;width:min(460px,46vw)}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ctl button.on{color:var(--acc2)}
.ctl .pp{background:var(--text);color:#150f33;width:48px;height:48px}
.ctl .pp .i{width:26px;height:26px}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--mute)}
.vol input{flex:none;width:90px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.ib.on{background:var(--acc);color:#150f33}

/* ---- «сейчас играет» ---- */
#np{position:fixed;inset:0;z-index:20;background:radial-gradient(800px 500px at 50% 0,#3a2a7a 0,transparent 65%),var(--bg);display:none;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 20px calc(14px + env(safe-area-inset-bottom));overflow:hidden;overscroll-behavior:contain}
#np.on{display:flex}
#np>*{width:min(460px,100%);flex:none}
#np .top{display:flex;align-items:center;justify-content:space-between}
#np .top>button:not(.pill){width:46px;height:46px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.pill{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-weight:600}
.pill .i{width:20px;height:20px}
.pill.on{background:var(--acc);border-color:var(--acc);color:#150f33}
#np .stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 0}
#np .cv{height:min(100%,84vw,400px);aspect-ratio:1;width:auto;max-width:100%;border-radius:20px;object-fit:cover;background:linear-gradient(135deg,#3a2c7a,#7a3a6a);box-shadow:0 20px 60px #0008}
#np .lyr{display:none;width:100%;height:100%;flex-direction:column;min-height:0}
#np.lyr-on .cv{display:none}
#np.lyr-on .lyr{display:flex}
.lbox{flex:1;min-height:0;overflow-y:auto;position:relative;text-align:center;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent)}
.lin{padding:42% 6px}
.lbox::-webkit-scrollbar{display:none}
.plainbox .lin{padding:14px 6px 30px}
.ln{font-size:var(--lsz,1.28rem);font-weight:700;line-height:1.35;color:var(--mute);opacity:.55;padding:7px 4px;cursor:pointer;transition:color .2s,opacity .2s,transform .2s}
.ln.on{color:var(--text);opacity:1;transform:scale(1.04)}
.ln.gap{font-size:1rem;letter-spacing:.2em}
.plain{white-space:pre-wrap;font-size:1.08rem;font-weight:600;line-height:1.6}
.lmsg{color:var(--mute);text-align:center;padding:30px 10px;line-height:1.5}
.lfoot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px;font-size:.78rem;color:var(--mute);min-height:40px}
.lfoot span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.llink{color:var(--acc);font-weight:600;flex:none;padding:8px 4px}
.lsearch{display:flex;gap:8px;width:100%}
.lsearch input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:0}
.lsearch input:focus{border-color:var(--acc)}
.lsearch button{padding:0 18px;border-radius:12px;background:var(--acc);color:#150f33;font-weight:700}
#np .meta{text-align:center;margin-top:4px}
#np h3{font-size:1.22rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#np .ar{color:var(--mute);margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#np .ctl{width:100%;justify-content:space-between}
#np .ctl button{width:50px;height:50px}
#np .ctl .pp{width:66px;height:66px}
#np .ctl .pp .i{width:32px;height:32px}

/* ---- скорость и тон ---- */
.speed{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px 8px;margin-top:10px}
.sp-h{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mute)}
.sp-v{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;min-width:74px}
.speed input[type=range]{width:100%;flex:none;display:block;margin-top:4px}
.sp-t{position:relative;height:15px;font-size:.7rem;color:var(--mute)}
.sp-t span{position:absolute;top:0}
.sp-t .t0{left:2px}.sp-t .t1{left:33.33%;transform:translateX(-50%)}.sp-t .t2{right:2px}
.sp-p{font-size:.76rem;color:var(--mute);text-align:center;margin-top:3px}

/* ---- диалоги ---- */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(460px,92vw);margin:auto}
dialog::backdrop{background:#000a}
dialog h3{margin-bottom:10px}
dialog p{color:var(--mute);font-size:.88rem;line-height:1.5;margin-bottom:12px}
dialog input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:12px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
dialog .row button{padding:12px 20px;border-radius:12px;background:var(--panel2)}
dialog .row .ok{background:var(--acc);color:#150f33;font-weight:700}
dialog input[type=range]{padding:0;border:0;border-radius:0;background:transparent;margin:4px 0 0}
dialog .speed{background:var(--bg);margin:6px 0 10px}
.tg{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;color:var(--text);margin:6px 0 16px}
.tg svg{width:28px;height:28px;color:#4fb4f0;flex:none}
.tg small{display:block;color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;max-width:min(92vw,560px);background:#3a1f2a;border:1px solid #7a3a4a;color:#ffd0d8;padding:12px 16px;border-radius:12px;font-size:.85rem;line-height:1.45;z-index:30;cursor:pointer}
#toast.ok{background:#1b3326;border-color:#3a7a52;color:#cfffe0}
body.lock #toast{bottom:auto;top:calc(72px + env(safe-area-inset-top))}

/* ---- вход ---- */
#auth{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(900px 500px at 15% -10%,#2a1f5c 0,transparent 60%),radial-gradient(700px 400px at 100% 0,#3a1f3d 0,transparent 55%),var(--bg)}
#auth.on{display:flex}
#auth.boot .acard{visibility:hidden}
.acard{width:min(400px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 24px 22px;box-shadow:0 20px 60px #0008}
.acard .logo{justify-content:center;margin-bottom:20px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;margin-bottom:20px}
.tabs2 button{padding:11px;border-radius:999px;color:var(--mute);font-weight:600}
.tabs2 button.on{background:var(--panel2);color:var(--text)}
.acard label{display:block;color:var(--mute);font-size:.8rem;margin:0 0 5px 4px}
.acard input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:12px}
.acard input:focus{border-color:var(--acc);outline:0}
.acard .go{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#c48cff);color:#150f33;font-weight:700;margin-top:2px}
.acard .go:disabled{opacity:.6;cursor:default}
.acard .alink{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px auto 0;color:var(--mute);font-size:.82rem;padding:10px}
.acard .alink .i{width:16px;height:16px}
.aerr{min-height:1.3em;color:#ffb3c0;font-size:.85rem;line-height:1.4;margin:0 0 8px 4px}
.ahint{color:var(--mute);font-size:.78rem;line-height:1.45;margin:-4px 0 12px 4px}
.role{display:inline-block;background:var(--acc2);color:#2a1408;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px}
.urow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.urow .ui{flex:1;min-width:180px}
.urow .ui b{display:block}
.urow .ui span{display:block;color:var(--mute);font-size:.8rem;margin-top:2px}
.urow button{padding:10px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:.85rem}
.urow .del{color:#ffb3c0}

@media(max-height:560px){#np .sp-t,#np .sp-p,#np .top .topt{display:none}}
@media(max-height:700px){#np .sp-p{display:none}}

/* ================= Android / телефон ================= */
@media(max-width:760px){
  html,body{height:auto;min-height:100%}
  body{display:block;height:auto}
  main{overflow:visible}
  header{padding:14px 14px 6px;gap:10px}
  .logo{font-size:1.5rem;flex:1;gap:10px}
  .logo .mark{width:38px;height:38px}
  .search{order:5;flex:1 1 100%;min-width:0;padding:4px 4px 4px 16px}
  .search input{height:44px}
  .search button{padding:0 22px;min-height:44px}
  .chips{padding:6px 14px 4px}
  .chips button{padding:9px 16px;font-size:.9rem}
  .wrap{padding:6px 12px calc(var(--nav) + 96px + env(safe-area-inset-bottom))}
  h2{font-size:1.05rem}
  .grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .card{padding:8px}
  /* нижняя навигация */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:16;max-width:none;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:0;background:#120f26f4;backdrop-filter:blur(14px);border-top:1px solid var(--line);justify-content:space-around}
  nav button{flex:1;flex-direction:column;gap:3px;padding:7px 0 5px;font-size:.72rem;border:0;border-radius:14px}
  nav button .i{display:block;width:24px;height:24px}
  nav .dsk{display:none}nav .mob{display:inline}
  nav button.on{color:var(--acc);background:#2a2450}
  /* мини-плеер */
  footer{left:8px;right:8px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 6px);border:1px solid var(--line);border-radius:18px;padding:8px 8px 10px 10px;background:#1d1838f2;box-shadow:0 8px 28px #0009}
  .mprog{display:block;position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;background:#3a3560}
  .mprog i{display:block;height:100%;width:0;border-radius:2px;background:var(--acc)}
  .bar{grid-template-columns:minmax(0,1fr) auto;gap:6px}
  .mid{width:auto}
  footer .seek,footer .js-shuf,footer .js-rep,.vol{display:none}
  footer .ctl{gap:2px}
  footer .ctl button{width:44px;height:44px}
  footer .ctl .pp{width:46px;height:46px}
  #toast{bottom:calc(var(--nav) + 100px + env(safe-area-inset-bottom))}
  /* полноэкранный плеер */
  #np{padding-left:18px;padding-right:18px}
  /* диалоги — «шторка» снизу */
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;border-bottom:0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
  dialog[open]{animation:sheet .22s ease-out}
  dialog .row button{flex:1}
  dialog input{font-size:16px}
}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
dialog{max-height:90dvh;overflow:auto}
body.noanim *{transition:none!important;animation:none!important}
#ann{background:#2a2450;border-bottom:1px solid var(--acc);padding:8px 16px;text-align:center;font-size:.88rem;position:relative;z-index:50}
.role.t{background:#7bd88f}.role.bn{background:#ff8a9a}
#me[data-role=owner]{box-shadow:0 0 0 2px var(--acc2)}#me[data-role=tester]{box-shadow:0 0 0 2px #7bd88f}
.sw{width:46px;height:26px;border-radius:999px;background:#3a3560;position:relative;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.srow select,.srow .tin{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;max-width:190px;width:auto;margin:0}
dialog h4{margin:16px 0 4px;color:var(--acc2);font-size:.9rem}
.abtn{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-top:8px;font-size:.9rem}
.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.atabs button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.atabs .on{background:var(--acc);color:#150f33;border-color:var(--acc);font-weight:700}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.kc b{display:block;font-size:1.4rem}.kc span{color:var(--mute);font-size:.8rem}
.afind{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;margin-bottom:12px}
.wrap .srow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.lg{font-size:.82rem;padding:7px 0;border-bottom:1px solid var(--line);color:var(--mute)}.lg b{color:var(--acc2);margin:0 6px}
.urow .ui b span.role{display:inline-block;color:#2a1408;margin:0 0 0 8px}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:700;margin-bottom:10px;background:var(--panel2)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-width:40px;height:40px;padding:0 8px;border-radius:12px;background:var(--panel2);border:2px solid transparent;font-size:1.15rem}
.pick button.on{border-color:var(--acc2)}
#accBio{margin:0 0 4px}
.nb{position:absolute;top:2px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--acc2);color:#2a1408;font-size:.7rem;display:grid;place-items:center;padding:0 4px}
nav button{position:relative}.gear{position:relative}.gear .nb{top:-2px;right:-2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#556;margin-right:8px}.dot.online{background:#5fd38a}.dot.away{background:#f0c35a}.dot.dnd{background:#ff6b6b}
.mini{min-height:44px;padding:0 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.ntf{padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}.ntf.un{color:var(--text);font-weight:700}.ntf small{display:block;color:var(--mute);font-weight:400}

/* ===== платформа поиска ===== */
.srcrow{max-width:1100px;width:100%;margin:auto;padding:4px 20px 0}
.srcsw{display:flex;gap:4px;padding:3px;width:max-content;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;position:relative}
.srcsw::before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 5px);border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--acc);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
.srcsw[data-on=sc]::before{transform:translateX(calc(100% + 4px))}
.srcsw button{position:relative;z-index:1;flex:1;min-width:104px;padding:7px 14px;border-radius:999px;color:var(--mute);font-weight:600;font-size:.85rem;transition:color .25s,transform .15s}
.srcsw button.on{color:var(--text)}
.srcsw button:active{transform:scale(.94)}
/* ===== анимации ===== */
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes npUp{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes cvIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #9b8cff00}50%{box-shadow:0 0 22px 2px #9b8cff66}}
@keyframes tabPop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:none}}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
#view.vin-cards .card{animation:cardIn .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*28ms)}
#view.vin-page,#h.hin{animation:pageIn .3s cubic-bezier(.2,.8,.2,1)}
#np.on{animation:npUp .34s cubic-bezier(.2,.8,.2,1)}
#np .cv{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
body:not(.playing) #np .cv{transform:scale(.9)}
#npCov.swap,#cov.swap{animation:cvIn .4s cubic-bezier(.2,.8,.2,1)}
.js-pp svg.pop{animation:pop .3s ease-out}
body.playing .card.cur .art{animation:glow 2.4s ease-in-out infinite}
.card{transition:background .15s,transform .15s}
.card:active{transform:scale(.97)}
nav button:active,.ctl button:active,.gear:active{transform:scale(.92)}
nav button.on svg{animation:tabPop .35s}
@media(min-width:761px){dialog[open]{animation:dlgIn .2s ease-out}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let SRC=ls.get('src','yt');
async function searchTracks(q){
  await linnReady;
  if(linnOk){try{const r=await tfetch(LINN+'/search?q='+enc(q)+'&src='+SRC+'&'+tq(),40000);if(r.length||SRC!=='yt')return r}catch(e){if(e.status===401){sessionLost();throw new Error('сессия истекла')}if(SRC!=='yt')throw e}}
  if(SRC!=='yt')throw new Error('SoundCloud работает только через сервер LINN');
  if(ytKey){
    const d=await tfetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&videoCategoryId=10&maxResults=30&q='+enc(q)+'&key='+enc(ytKey));
    return d.items.map(i=>({id:i.id.videoId,title:decode(i.snippet.title),user:decode(i.snippet.channelTitle),thumb:i.snippet.thumbnails.high.url}));
  }
  for(const b of bases()){
    for(const f of ['music_songs','videos']){
      try{
        const d=await tfetch(b+'/search?q='+enc(q)+'&filter='+f);
        const items=(d.items||[]).filter(i=>i.url&&i.url.includes('v=')).map(i=>({id:i.url.split('v=')[1].split('&')[0],title:i.title,user:i.uploaderName||'',thumb:i.thumbnail}));
        if(items.length){good=b;return items}
      }catch(e){break}
    }
  }
  throw new Error('поисковые сервера не отвечают');
}
async function streamFrom(b,id){
  const d=await tfetch(b+'/streams/'+id,8000);
  const s=(d.audioStreams||[]).filter(x=>x.url);
  if(!s.length)throw new Error('no audio');
  const m4=s.filter(x=>/mp4/.test(x.mimeType||''));
  const p=(m4.length?m4:s).sort((x,y)=>(y.bitrate||0)-(x.bitrate||0))[0];
  let u=p.url;
  if(d.proxyUrl){try{const x=new URL(u),h=new URL(d.proxyUrl).host;if(x.host!==h&&!x.searchParams.has('host')){x.searchParams.set('host',x.host);x.host=h;u=x.toString()}}catch(e){}}
  return {url:u,base:b};
}
async function resolve(id,tried){
  const list=bases().filter(b=>!tried.has(b));
  for(let i=0;i<list.length;i+=3){
    const batch=list.slice(i,i+3);
    try{return await Promise.any(batch.map(b=>streamFrom(b,id).catch(e=>{tried.add(b);throw e})))}catch(e){}
  }
  throw new Error('нет ответа от серверов');
}
function tryAudio(url,ms=12000){
  return new Promise(res=>{
    let done=false,to;
    const fin=v=>{if(done)return;done=true;clearTimeout(to);a.removeEventListener('canplay',ok);a.removeEventListener('error',bad);res(v)};
    const ok=()=>{a.play().catch(e=>{if(e&&e.name==='NotAllowedError')$('ar').textContent='Нажми Play, чтобы начать'});fin(true)};
    const bad=()=>fin(false);
    to=setTimeout(bad,ms);
    a.addEventListener('canplay',ok);a.addEventListener('error',bad);
    a.src=url;applyFx();a.load();
  });
}
function ytId(s){const m=s.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(s)?s:null}

/* ---------- скорость и тон (ползунок 0.5×–2×) ---------- */
function applyFx(){
  const t=cur();if(!t)return;
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=false;   // тон меняется вместе со скоростью
  const r=rateOf(t.id);a.defaultPlaybackRate=r;a.playbackRate=r;
  mediaPos();
}
function buildSpeed(box,get){
  box.innerHTML='<div class="sp-h"><span>Скорость и тон</span><button type="button" class="sp-v" title="Сбросить на 1×"></button></div><input type="range" class="sp-r" min="'+RMIN+'" max="'+RMAX+'" step="0.01" value="1" aria-label="Скорость и тон"><div class="sp-t"><span class="t0">'+RMIN+'×</span><span class="t1" style="left:'+((1-RMIN)/(RMAX-RMIN)*100)+'%">1×</span><span class="t2">'+RMAX+'×</span></div><div class="sp-p"></div>';
  const r=box.querySelector('.sp-r');
  r.oninput=()=>{const t=get();if(t)setRate(t,+r.value,false)};
  r.onchange=()=>{const t=get();if(t)setRate(t,+r.value,true)};
  box.querySelector('.sp-v').onclick=()=>{const t=get();if(t)setRate(t,1,true)};
}
function syncSpeed(box,t){
  const r=rateOf(t.id),inp=box.querySelector('.sp-r');if(!inp)return;
  inp.value=r;fillRange(inp);
  box.querySelector('.sp-v').textContent=fmtRate(r)+'×';
  const st=12*Math.log2(r);
  box.querySelector('.sp-p').textContent=r===1?'Оригинальная скорость и тональность':'Тон '+(st>0?'+':'−')+Math.abs(st).toFixed(1)+' полутона';
}
function setRate(t,r,commit){
  r=Math.min(RMAX,Math.max(RMIN,r));if(Math.abs(r-1)<.04)r=1;r=Math.round(r*100)/100;
  if(r===1)delete fx[t.id];else fx[t.id]=r;
  if(cur()&&cur().id===t.id){applyFx();syncSpeed($('npSpeed'),t)}
  if(editing&&editing.id===t.id)syncSpeed($('fxSpeed'),t);
  if(commit){saveData();draw()}
}
function openFx(t){editing=t;$('fxTi').textContent=t.title;syncSpeed($('fxSpeed'),t);$('fxDlg').showModal()}
$('fxClose').onclick=()=>$('fxDlg').close();

async function play(l,i){
  queue=l.slice();qi=i;const t=cur(),my=++tok;if(P.restore)ls.set('last',t);
  $('ti').textContent=t.title;$('ar').textContent='Загружаю…';
  $('cov').src=t.thumb||'';$('cov').hidden=!t.thumb;$('ph').hidden=!!t.thumb;
  $$('.js-sk').forEach(e=>{e.value=0;fillRange(e)});$('mprog').style.width='0';$$('.js-cur').forEach(e=>e.textContent='0:00');$$('.js-du').forEach(e=>e.textContent='0:00');
  draw();syncNP();lyrUpdate();
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.user||'',artwork:t.thumb?[{src:t.thumb,sizes:'480x360'}]:[]});
  try{
    await linnReady;if(my!==tok)return;
    let ok=false;
    if(linnOk){
      ok=await tryAudio(LINN+'/stream/'+t.id+'?'+tq(),40000);if(my!==tok)return;
      if(!ok){try{await tfetch(LINN+'/resolve/'+t.id+'?'+tq(),60000)}catch(e){if(e.status===401){sessionLost();return}toast('Сервер LINN не смог взять звук. '+hint(String(e.message))+' Подробности в чёрном окне сервера.')}}
    }
    const tried=new Set();
    for(let n=0;n<5&&!ok;n++){
      const r=await resolve(t.id,tried);if(my!==tok)return;
      ok=await tryAudio(r.url);if(my!==tok)return;
      if(ok)good=r.base;else tried.add(r.base);
    }
    if(!ok)throw new Error('fail');
    $('ar').textContent=t.user||'';syncNP();
  }catch(e){
    if(my!==tok)return;
    $('ar').textContent='Не удалось загрузить. Запусти start.bat (свой сервер) или проверь адрес сервера в настройках';
  }
}
function step(d){
  if(!queue.length)return;
  play(queue,shuffle&&d>0?Math.floor(Math.random()*queue.length):(qi+d+queue.length)%queue.length);
}
const toggle=()=>{if(qi<0)return;if(!a.getAttribute('src')){play(queue,qi);return}a.paused?a.play().catch(()=>{}):a.pause()};

$$('.js-prev').forEach(b=>b.onclick=()=>{if(a.currentTime>3)a.currentTime=0;else step(-1)});
$$('.js-shuf').forEach(b=>b.onclick=()=>{shuffle=!shuffle;$$('.js-shuf').forEach(x=>x.classList.toggle('on',shuffle))});
$$('.js-rep').forEach(b=>b.onclick=()=>{repeat=!repeat;$$('.js-rep').forEach(x=>x.classList.toggle('on',repeat))});
const setPP=()=>$$('.js-pp').forEach(b=>b.innerHTML=ic(a.paused?'play':'pause'));
function mediaPos(){
  const m=navigator.mediaSession;if(!m||!m.setPositionState)return;
  try{if(isFinite(a.duration)&&a.duration>0)m.setPositionState({duration:a.duration,playbackRate:a.playbackRate||1,position:Math.min(a.currentTime,a.duration)})}catch(e){}
}
a.onplay=a.onpause=()=>{setPP();mediaPos()};
a.onloadedmetadata=applyFx;
a.onratechange=a.onseeked=mediaPos;
a.onended=()=>{if(repeat){a.currentTime=0;a.play()}else if(P.autonext)step(1)};
a.ontimeupdate=()=>{

  lyrTick();

$$('.js-sk').forEach(s=>{

  s.onchange=()=>{if(a.duration)a.currentTime=s.value/1000*a.duration;seeking=false};
});
$('vol').oninput=e=>{a.volume=e.target.value/100;fillRange(e.target);if(P.restore)ls.set('lastvol',+e.target.value)};
{const v=P.restore?ls.get('lastvol',P.vol):P.vol;$('vol').value=v;a.volume=v/100;fillRange($('vol'))}
document.addEventListener('keydown',e=>{
  if(e.code==='Escape'){closeNP();return}
  const tg=e.target.tagName;
  if(tg==='INPUT'&&e.target.type!=='range'||tg==='BUTTON'||tg==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(!P.hotkeys||e.ctrlKey||e.metaKey||e.altKey)return;
  else if(e.code==='ArrowRight')a.currentTime+=10;else if(e.code==='ArrowLeft')a.currentTime-=10;
  else if(e.code==='KeyN')step(1);else if(e.code==='KeyP')step(-1);else if(e.code==='KeyM')a.muted=!a.muted;
  else if(e.code==='KeyL'&&cur())toggleLike(cur());
});
if('mediaSession' in navigator){
  const m=navigator.mediaSession,h=(n,f)=>{try{m.setActionHandler(n,f)}catch(e){}};
  h('play',()=>a.play());h('pause',()=>a.pause());h('nexttrack',()=>step(1));h('previoustrack',()=>step(-1));
  h('seekto',d=>{if(d.seekTime!=null)a.currentTime=d.seekTime});
}

/* ---------- тексты песен ---------- */
let lyr={id:null,state:'idle'}, lyrOn=false, lyrTok=0, lyrCache={}, lyrScrollAt=0;
function parseLrc(s){
  const out=[];
  for(const ln of String(s).split(/\r?\n/)){
    const ts=[...ln.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    if(!ts.length)continue;
    const txt=ln.replace(/\[[^\]]*\]/g,'').trim();
    ts.forEach(m=>out.push({t:+m[1]*60+ +m[2],s:txt}));
  }
  return out.sort((x,y)=>x.t-y.t);
}
function lyrSet(on){
  lyrOn=on;$('np').classList.toggle('lyr-on',on);
  $('npLyr').classList.toggle('on',on);$$('.js-lyr').forEach(b=>b.classList.toggle('on',on));
  if(on)lyrLoad();
}
function lyrUpdate(){if(lyrOn)lyrLoad()}
async function lyrLoad(q){
  const t=cur();if(!t)return lyrRender();
  const my=++lyrTok;
  if(!q&&lyrCache[t.id]){lyr=lyrCache[t.id];return lyrRender()}
  lyr={id:t.id,state:'loading'};lyrRender();
  try{
    const dur=isFinite(a.duration)&&a.duration>0?Math.round(a.duration):(t.duration||0);
    const r=await tfetch(LINN+'/lyrics?title='+enc(t.title)+'&artist='+enc(t.user||'')+(dur?'&dur='+dur:'')+(q?'&q='+enc(q):'')+'&'+tq(),30000);
    if(my!==lyrTok)return;
    const lines=r.synced?parseLrc(r.synced):[];
    if(r.found&&(lines.length||r.plain))lyr={id:t.id,state:'ok',lines:lines.length?lines:null,plain:r.plain||'',info:(r.artist?r.artist+' — ':'')+(r.title||''),idx:-1};
    else lyr={id:t.id,state:'none'};
    lyrCache[t.id]=lyr;
  }catch(e){
    if(my!==lyrTok)return;
    if(e.status===401)return sessionLost();
    lyr={id:t.id,state:'err'};
  }
  lyrRender();
}
function lyrForm(){
  const f=document.createElement('form');f.className='lsearch';
  f.innerHTML='<input placeholder="Исполнитель и название" enterkeyhint="search" autocomplete="off"><button>Найти</button>';
  f.onsubmit=e=>{e.preventDefault();const i=f.querySelector('input'),v=i.value.trim();if(v){i.blur();lyrLoad(v)}};
  return f;
}
function lyrRender(){
  const b=$('lyrBox'),ft=$('lyrFoot');b.innerHTML='';ft.innerHTML='';b.classList.remove('plainbox');b.scrollTop=0;
  const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
  const w=mk('div','lin');b.appendChild(w);
  if(!cur()){b.classList.add('plainbox');w.appendChild(mk('div','lmsg','Выбери трек, и здесь появится его текст.'));return}
  if(lyr.state==='loading'||lyr.state==='idle'){b.classList.add('plainbox');w.appendChild(mk('div','lmsg','Ищу текст…'));return}
  if(lyr.state==='err'){
    b.classList.add('plainbox');w.appendChild(mk('div','lmsg','Не удалось получить текст. Проверь, что сервер LINN запущен.'));
    const r=mk('button','llink','Повторить');r.onclick=()=>lyrLoad();ft.appendChild(mk('span',''));ft.appendChild(r);return;
  }
  if(lyr.state==='none'){
    b.classList.add('plainbox');w.appendChild(mk('div','lmsg','Текст этого трека не нашёлся. Попробуй найти вручную:'));
    ft.appendChild(lyrForm());return;
  }
  if(lyr.lines){
    lyr.lines.forEach(l=>{const p=mk('p','ln'+(l.s?'':' gap'),l.s||'· · ·');p.onclick=()=>{a.currentTime=l.t;lyrScrollAt=0};w.appendChild(p)});
    lyr.idx=-1;lyrTick();
  }else{b.classList.add('plainbox');w.appendChild(mk('div','plain',lyr.plain))}
  ft.appendChild(mk('span','',lyr.info||''));
  const l=mk('button','llink','Не тот текст?');
  l.onclick=()=>{ft.innerHTML='';const f=lyrForm();ft.appendChild(f);f.querySelector('input').focus()};
  ft.appendChild(l);
}
function lyrTick(){
  if(!lyrOn||lyr.state!=='ok'||!lyr.lines)return;
  const L=lyr.lines,t=a.currentTime+.25;
  let i=-1;for(let k=0;k<L.length;k++){if(L[k].t<=t)i=k;else break}
  if(i===lyr.idx)return;
  const els=$('lyrBox').querySelectorAll('.ln');
  if(els[lyr.idx])els[lyr.idx].classList.remove('on');
  lyr.idx=i;

async function api(path,body){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{
    const h={};if(TOKEN)h.Authorization='Bearer '+TOKEN;if(body)h['Content-Type']='application/json';
    const r=await fetch(LINN+path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined,signal:c.signal});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(d.error||'Ошибка сервера ('+r.status+')');e.status=r.status;throw e}
    return d;
  }catch(e){
    if(e.status)throw e;
    throw new Error('Нет связи с сервером LINN. Запусти start.bat или проверь адрес в настройках.');

}

function uRow(u){
  const r=arow(u.login,(u.nick?'«'+u.nick+'» · ':'')+'рег.: '+dt(u.created)+' · вход: '+dt(u.last)+' · треков: '+u.liked+(u.note?' · ✎ '+u.note:'')+(u.banned&&u.ban_reason?' · причина: '+u.ban_reason:''));
  const b=r.querySelector('b'),tt=u.role==='tester';
  const rb=el('span','role'+(tt?' t':''),tt?'ТЕСТЕРОВЩИК':'Пользователь');rb.style.marginLeft='8px';b.appendChild(rb);
  if(u.banned){const x=el('span','role bn','БАН');x.style.marginLeft='6px';b.appendChild(x)}
  const U=o=>api('/api/admin/user',{login:u.login,...o});
  abt(r,tt?'Снять тестера':'Сделать тестером',()=>U({action:'role',role:tt?'user':'tester'}));
  abt(r,u.banned?'Разбанить':'Бан',()=>{if(u.banned)return U({action:'ban',on:false});const w=prompt('Причина бана:');if(w===null)return;return U({action:'ban',on:true,reason:w})},'del');
  abt(r,'Пароль',async()=>{const p=prompt('Новый пароль для '+u.login+' (от 6 символов):');if(p===null)return;await api('/api/admin/password',{login:u.login,password:p});toast('Пароль изменён',true)});
  abt(r,'Выкинуть',()=>U({action:'kick'}));
  abt(r,'Коллекция',async()=>{const d=await U({action:'view'});alert(d.liked.length?d.liked.slice(0,60).map(t=>t.title+' — '+(t.user||'')).join('\n'):'Пусто')});
  abt(r,'Заметка',async()=>{const n=prompt('Заметка о пользователе:',u.note||'');if(n===null)return;await U({action:'note',note:n})});
  abt(r,'Очистить',async()=>{if(confirm('Очистить коллекцию '+u.login+'?'))await U({action:'clear'})},'del');
  abt(r,'Удалить',async()=>{if(confirm('Удалить '+u.login+' вместе с коллекцией?'))await api('/api/admin/delete',{login:u.login})},'del');
  return r;
}

<script>
/* платформа поиска + анимации интерфейса */
(function(){
  var sw=document.getElementById('srcsw'),row=document.getElementById('srcrow'),chips=document.getElementById('chips'),q=document.getElementById('q');
  function applySrc(s,fromUser){
    SRC=s;ls.set('src',s);sw.dataset.on=s;
    [].forEach.call(sw.querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.s===s)});
    q.placeholder=s==='sc'?'Артист или трек на SoundCloud':'Артист, трек или ссылка на YouTube';
    if(fromUser&&q.value.trim())run(q.value.trim());
  }
  sw.addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.dataset.s!==SRC)applySrc(b.dataset.s,true)});
  applySrc(SRC==='sc'?'sc':'yt',false);
  var _nav=setNav;setNav=function(){_nav.apply(this,arguments);row.style.display=chips.style.display};
  row.style.display=chips.style.display;

  var view=document.getElementById('view'),hd=document.getElementById('h'),last='';
  function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
  function pageAnim(key){
    if(key===last)return;last=key;
    if(document.body.classList.contains('noanim'))return;
    var cards=view.querySelectorAll('.card');
    view.classList.remove('vin-cards','vin-page');
    cards.forEach(function(c,i){c.style.setProperty('--i',Math.min(i,16))});
    void view.offsetWidth;view.classList.add(cards.length?'vin-cards':'vin-page');
    restart(hd,'hin');
  }
  var _draw=draw;
  draw=function(m){_draw(m);var h=(typeof home!=='undefined'&&home)?home.q:'';pageAnim(mode+'|'+(mode==='home'?h:''))};
  new MutationObserver(function(){if(mode==='fr'||mode==='adm')pageAnim(mode)}).observe(view,{childList:true});

  ['npCov','cov'].forEach(function(id){
    var el=document.getElementById(id);if(!el)return;var prev=el.getAttribute('src');
    new MutationObserver(function(){var s=el.getAttribute('src');if(s&&s!==prev)restart(el,'swap');prev=s}).observe(el,{attributes:true,attributeFilter:['src']});
  });
  function pop(){[].forEach.call(document.querySelectorAll('.js-pp svg'),function(s){restart(s,'pop')})}
  a.addEventListener('play',function(){document.body.classList.add('playing');pop()});
  a.addEventListener('pause',function(){document.body.classList.remove('playing');pop()});
  a.addEventListener('ended',function(){document.body.classList.remove('playing')});
})();
</script>
<script>
/* только для iOS-приложения: поле «Сервер» на экране входа */
(function(){
  var i=document.getElementById('aSrv');if(!i)return;
  var norm=function(v){v=(v||'').trim().replace(/\/+$/,'');if(v&&!/^https?:\/\//i.test(v))v='https://'+v;return v};
  i.value=(typeof LINN==='string'&&/^https?:/i.test(LINN))?LINN:'';
  i.addEventListener('input',function(){var v=norm(i.value);if(v){ls.set('linn',v);LINN=v}});
  i.addEventListener('change',async function(){
    var v=norm(i.value);i.value=v;if(!v)return;
    ls.set('linn',v);LINN=v;linnReady=pingLinn();await linnReady;showSrv();
    var e=document.getElementById('aErr');if(e)e.textContent=linnOk?'':'Сервер не отвечает. Проверь адрес и что туннель запущен.';
  });
})();
</script>
