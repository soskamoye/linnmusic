name: Build IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install

      - name: Балласт (увеличивает размер приложения)
        run: head -c 150M /dev/urandom > www/ballast.bin

      - name: Создание iOS-проекта
        run: npx cap add ios

      - name: Настройка Info.plist (фоновое аудио, разрешение на http)
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PL" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PL" || true
          /usr/libexec/PlistBuddy -c "Print" "$PL"

      - name: Сборка без подписи
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковка в .ipa
        working-directory: ios/App
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry LINNmusic.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LINNmusic-ipa
          path: ios/App/LINNmusic.ipa
